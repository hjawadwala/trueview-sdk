<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TrueView SDK • Quick Connect</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg-1: #0f172a; /* slate-900 */
        --bg-2: #111827; /* gray-900 */
        --card: #0b1220; /* deep */
        --muted: #a1a1aa; /* zinc-400 */
        --text: #e5e7eb; /* gray-200 */
        --accent: #22d3ee; /* cyan-400 */
        --accent-2: #60a5fa; /* blue-400 */
        --danger: #ef4444;
        --success: #22c55e;
        --shadow: 0 10px 40px rgba(0,0,0,.45);
      }

      html, body { height: 100%; }
      body {
        margin: 0;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
        color: var(--text);
        background: radial-gradient(1000px 600px at 10% 10%, rgba(34,211,238,.08), transparent 60%),
                    radial-gradient(800px 500px at 100% 0%, rgba(96,165,250,.08), transparent 60%),
                    linear-gradient(180deg, var(--bg-1), var(--bg-2));
        display: grid;
        grid-template-rows: auto 1fr auto;
      }

      header {
        padding: 18px 24px;
        display: flex;
        align-items: center;
        gap: 12px;
        border-bottom: 1px solid rgba(255,255,255,.06);
        backdrop-filter: blur(6px);
      }
      header img { height: 28px; }
      header h1 { font-size: 16px; margin: 0; font-weight: 600; letter-spacing: .3px; }

      .container {
        padding: 24px;
        display: grid;
        grid-template-columns: 380px 1fr;
        gap: 24px;
        max-width: 1400px;
        width: 100%;
        margin: 0 auto;
        box-sizing: border-box;
      }

      .card {
        background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02)) border-box,
                    linear-gradient(180deg, rgba(34,211,238,.35), rgba(96,165,250,.25)) padding-box;
        border: 1px solid transparent;
        border-radius: 14px;
        padding: 18px;
        box-shadow: var(--shadow);
      }

      .card h2 { margin: 0 0 14px 0; font-size: 14px; font-weight: 600; letter-spacing: .3px; color: #fff; }
      .form-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
      label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 6px; }
      .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
      .row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }

      input, select, button {
        width: 100%;
        box-sizing: border-box;
        border-radius: 10px;
        border: 1px solid rgba(255,255,255,.12);
        background: rgba(8,11,19,.65);
        color: #e5e7eb;
        padding: 10px 12px;
        outline: none;
        transition: border-color .15s ease, box-shadow .15s ease;
      }
      input::placeholder { color: #9ca3af; }
      input:focus, select:focus { border-color: rgba(34,211,238,.6); box-shadow: 0 0 0 3px rgba(34,211,238,.18); }
      button { cursor: pointer; font-weight: 600; background: linear-gradient(135deg, rgba(34,211,238,.9), rgba(96,165,250,.9)); border: none; }
      button.secondary { background: transparent; border: 1px solid rgba(255,255,255,.15); }
      button:disabled { opacity: .6; cursor: not-allowed; }

      .status { margin-top: 10px; font-size: 12px; color: var(--muted); min-height: 18px; }

      .player-card { position: relative; }
      .canvas-wrap { background: #000; border-radius: 14px; overflow: hidden; display: grid; place-items: center; border: 1px solid rgba(255,255,255,.06); }
      canvas { width: 100%; height: auto; max-height: calc(100vh - 200px); display: block; background: #000; }

      .pill { position: absolute; top: 12px; left: 12px; padding: 6px 10px; font-size: 12px; border-radius: 999px; background: rgba(17, 24, 39, .75); border: 1px solid rgba(255,255,255,.12); }
      .toolbar { display: flex; gap: 10px; margin-top: 12px; }
      footer { padding: 10px 24px; color: var(--muted); font-size: 12px; text-align: center; }
      @media (max-width: 1100px) { .container { grid-template-columns: 1fr; } }
    </style>
    <!-- Core SDK scripts (pointing to sdk-dist) -->
    <script src="./sdk-dist/decoder_def.js"></script>
    <script src="./sdk-dist/jadecoder.js"></script>
    <script src="./sdk-dist/hevcdec.js"></script>
    <script src="./sdk-dist/glutils.js"></script>
    <script src="./sdk-dist/connector.js"></script>
    <script src="./sdk-dist/md5.js"></script>
  </head>
  <body>
    <header>
      <img src="./sdk-dist/logo_bg.png" alt="TrueView" />
      <h1>TrueView Quick Connect</h1>
    </header>

  <main class="container">
      <section class="card">
        <h2>Connection</h2>
        <form id="connect-form" class="form-grid">
          <div>
            <label for="deviceId">Device ID</label>
            <input id="deviceId" name="deviceId" type="text" placeholder="e.g. 924957972" required />
          </div>

          <div class="row">
            <div>
              <label for="username">Username</label>
              <input id="username" name="username" type="text" value="admin" required />
            </div>
            <div>
              <label for="password">Password</label>
              <input id="password" name="password" type="password" placeholder="••••••" />
            </div>
          </div>

          <div class="row-3">
            <div>
              <label for="stream">Stream</label>
              <select id="stream" name="stream">
                <option value="0">Main</option>
                <option value="1" selected>Sub</option>
              </select>
            </div>
            <div>
              <label for="channel">Channel</label>
              <input id="channel" name="channel" type="number" min="0" step="1" value="0" />
            </div>
            <div>
              <label for="protocol">Protocol</label>
              <select id="protocol" name="protocol">
                <option value="wss" selected>WSS (secure)</option>
                <option value="ws">WS</option>
              </select>
            </div>
          </div>

          <div class="toolbar">
            <button id="btnConnect" type="submit">Connect & Play</button>
            <button id="btnDisconnect" type="button" class="secondary">Disconnect</button>
          </div>

          <div id="status" class="status">Idle</div>
        </form>
      </section>

      <section class="card player-card">
        <div class="pill" id="pill">Ready</div>
        <div class="canvas-wrap">
          <!-- Use 960x640 like indexEN for compatibility -->
          <canvas id="canvas" width="960" height="640"></canvas>
        </div>
        <div class="toolbar">
          <button id="btnSnapshot" type="button" class="secondary">Snapshot</button>
          <button id="btnMute" type="button" class="secondary">Toggle Audio</button>
        </div>
      </section>

      <!-- Tabs: Device settings and Playback history -->
      <section class="card" id="tabs-card">
        <div class="toolbar" style="margin:0 0 12px 0">
          <button type="button" class="secondary" id="tabDevice">Device Settings</button>
          <button type="button" class="secondary" id="tabPlayback">Playback History</button>
        </div>

        <div id="panelDevice">
          <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px">
            <div>
              <label>Main Stream Codec</label>
              <div id="dev_main_codec" class="status">—</div>
            </div>
            <div>
              <label>Sub Stream Codec</label>
              <div id="dev_sub_codec" class="status">—</div>
            </div>

            <div>
              <label>Flip</label>
              <div id="dev_flip" class="status">—</div>
            </div>
            <div>
              <label>Mirror</label>
              <div id="dev_mirror" class="status">—</div>
            </div>

            <div>
              <label>Audio Enabled</label>
              <div id="dev_audio_enabled" class="status">—</div>
            </div>
            <div>
              <label>Audio Volume (In/Out)</label>
              <div id="dev_audio_volume" class="status">—</div>
            </div>

            <div>
              <label>IR Mode</label>
              <div id="dev_ir" class="status">—</div>
            </div>
            <div>
              <label>Usage Scenario</label>
              <div id="dev_usage" class="status">—</div>
            </div>

            <div>
              <label>Record Mode</label>
              <div id="dev_rec_mode" class="status">—</div>
            </div>
            <div>
              <label>Motion Detect</label>
              <div id="dev_md" class="status">—</div>
            </div>

            <div>
              <label>TF Card</label>
              <div id="dev_tf" class="status">—</div>
            </div>
            <div>
              <label>LTE</label>
              <div id="dev_lte" class="status">—</div>
            </div>
          </div>

          <div class="toolbar" style="margin-top:14px">
            <button type="button" id="btnRefreshDevice" class="secondary">Refresh Device Info</button>
          </div>
        </div>

        <div id="panelPlayback" style="display:none">
          <div class="row" style="margin-bottom:10px">
            <div>
              <label for="pbDate">Date</label>
              <input id="pbDate" type="date" />
            </div>
            <div>
              <label for="pbChannel">Channel</label>
              <input id="pbChannel" type="number" min="0" step="1" value="0" />
            </div>
          </div>
          <div class="toolbar" style="margin-bottom:8px">
            <button type="button" id="btnSearchRecords">Search</button>
          </div>
          <div style="overflow:auto; max-height: 320px; border:1px solid rgba(255,255,255,.08); border-radius:10px;">
            <table style="width:100%; border-collapse:collapse; font-size:13px;">
              <thead>
                <tr style="background:rgba(255,255,255,.04)">
                  <th style="text-align:left; padding:8px; border-bottom:1px solid rgba(255,255,255,.08);">Start</th>
                  <th style="text-align:left; padding:8px; border-bottom:1px solid rgba(255,255,255,.08);">End</th>
                  <th style="text-align:left; padding:8px; border-bottom:1px solid rgba(255,255,255,.08);">Duration (s)</th>
                  <th style="text-align:left; padding:8px; border-bottom:1px solid rgba(255,255,255,.08);">Type</th>
                  <th style="text-align:left; padding:8px; border-bottom:1px solid rgba(255,255,255,.08);">Action</th>
                </tr>
              </thead>
              <tbody id="historyBody"></tbody>
            </table>
          </div>
        </div>
      </section>
    </main>

    <footer>Powered by TrueView SDK</footer>

    <!-- Player helpers -->
    <script src="./sdk-dist/play.js"></script>
    <script src="./sdk-dist/g711a_al.js"></script>
    <script>
      const $ = (sel) => document.querySelector(sel);
      const statusEl = $('#status');
      const pillEl = $('#pill');
      const canvas = $('#canvas');
      let audioOn = false;

      function setStatus(text, tone = 'muted') {
        statusEl.textContent = text;
        if (tone === 'ok') { pillEl.textContent = 'Playing'; pillEl.style.borderColor = 'rgba(34,197,94,.5)'; }
        else if (tone === 'warn') { pillEl.textContent = 'Connecting…'; pillEl.style.borderColor = 'rgba(250,204,21,.5)'; }
        else if (tone === 'err') { pillEl.textContent = 'Error'; pillEl.style.borderColor = 'rgba(239,68,68,.5)'; }
        else { pillEl.textContent = 'Ready'; pillEl.style.borderColor = 'rgba(255,255,255,.15)'; }
      }

      window.addEventListener('DOMContentLoaded', () => {
        try {
          Player.init([canvas]);
          setStatus('Ready to connect');
        } catch (e) {
          console.error(e);
          setStatus('Failed to initialize player', 'err');
        }
      });

      $('#connect-form').addEventListener('submit', (ev) => {
        ev.preventDefault();
        const deviceId = $('#deviceId').value.trim();
        const username = $('#username').value.trim();
        const password = $('#password').value;
        const stream = parseInt($('#stream').value, 10) || 1;
        const channel = parseInt($('#channel').value, 10) || 0;
        const protocol = $('#protocol').value;
        if (!deviceId) { setStatus('Please enter a device ID', 'warn'); return; }
        $('#btnConnect').disabled = true;
        setStatus('Connecting…', 'warn');
        try {
          Player.ConnectDevice(deviceId, '', username, password, 0, 80, 1, channel, stream, protocol, null);
          Player.OpenStream(deviceId, '', channel, stream, 0);
        } catch (e) {
          console.error(e);
          setStatus('Connection error', 'err');
          $('#btnConnect').disabled = false;
          return;
        }
        setTimeout(() => setStatus('Negotiating P2P / Login…', 'warn'), 250);
      });

      const _onopenstream = ConnectApi.onopenstream;
      ConnectApi.onopenstream = function(api_conn, channel, streamid, result, cam_desc) {
        try { _onopenstream && _onopenstream(api_conn, channel, streamid, result, cam_desc); } catch (_) {}
        if (result === 0) {
          setStatus(`Playing • CH ${channel} • ${streamid === 0 ? 'Main' : 'Sub'}`, 'ok');
          $('#btnConnect').disabled = false;
          // Auto: fetch device info and today’s history
          try { fetchDeviceInfo(); } catch (e) { console.warn(e); }
          try { initPlaybackDate(); searchRecords(); } catch (e) { console.warn(e); }
        } else {
          setStatus('Open stream failed', 'err');
          $('#btnConnect').disabled = false;
        }
      };

      const _ondisconnect = ConnectApi.ondisconnect;
      ConnectApi.ondisconnect = function(api_conn, code) {
        try { _ondisconnect && _ondisconnect(api_conn, code); } catch (_) {}
        setStatus('Disconnected');
      };

      $('#btnDisconnect').addEventListener('click', () => {
        const deviceId = $('#deviceId').value.trim();
        if (!deviceId) return;
        try {
          Player.DisConnectDevice(deviceId, '');
          setStatus('Disconnected');
        } catch (e) {
          console.error(e);
          setStatus('Disconnect error', 'err');
        }
      });

      $('#btnSnapshot').addEventListener('click', () => {
        try { Player.Snapshot(0, 'snapshot.png'); } catch(e) { console.error(e); }
      });

      $('#btnMute').addEventListener('click', () => {
        try {
          if (audioOn) { Player.CloseAudio(0); setStatus('Audio: Off'); }
          else { Player.OpenAudio(0); setStatus('Audio: On'); }
          audioOn = !audioOn;
        } catch (e) { console.error(e); }
      });

      // Tabs behavior
      const tabDevice = $('#tabDevice');
      const tabPlayback = $('#tabPlayback');
      const panelDevice = $('#panelDevice');
      const panelPlayback = $('#panelPlayback');
      function showTab(which){
        if(which === 'device'){ panelDevice.style.display='block'; panelPlayback.style.display='none'; }
        else { panelDevice.style.display='none'; panelPlayback.style.display='block'; }
      }
      tabDevice.addEventListener('click', () => showTab('device'));
      tabPlayback.addEventListener('click', () => showTab('playback'));

      // Device info fetch/render
      function buildGetConfig(){
        const username = $('#username').value.trim();
        const password = $('#password').value;
        return {
          Version: '1.3.0',
          Method: 'get',
          IPCam: {
            ModeSetting: {},
            videoManager: {},
            AlarmSetting: { MotionDetection: {} },
            ChannelStatus: {},
            LTE: {},
            TfcardManager: {}
          },
          Authorization: { Verify: '', username, password }
        };
      }

      function fetchDeviceInfo(){
        const devid = $('#deviceId').value.trim();
        if(!devid) return;
        const session = GetSessionById(devid);
        if(!session){ setStatus('Not connected', 'warn'); return; }
        const cfg = JSON.stringify(buildGetConfig());
        ConnectApi.remote_setup2(session, cfg);
      }

      function text(val){ return (val===undefined||val===null||val==='') ? '—' : String(val); }
      function yesno(b){ return b ? 'Yes' : 'No'; }
      function renderDevice(config){
        // videoManager may be single object; stream info often needs dedicated calls. Display what we have.
        const vm = config?.IPCam?.videoManager || {};
        // If encType corresponds to current streamId in reply, just show it on proper label
        if(vm.streamId === 1) $('#dev_main_codec').textContent = text(vm.encType);
        if(vm.streamId === 2) $('#dev_sub_codec').textContent = text(vm.encType);
        if(vm.flipEnabled !== undefined) $('#dev_flip').textContent = yesno(vm.flipEnabled);
        if(vm.mirrorEnabled !== undefined) $('#dev_mirror').textContent = yesno(vm.mirrorEnabled);

        const ms = config?.IPCam?.ModeSetting || {};
        if(ms.AudioEnabled !== undefined) $('#dev_audio_enabled').textContent = yesno(ms.AudioEnabled);
        if(ms.AudioVolume) $('#dev_audio_volume').textContent = `${text(ms.AudioVolume.AudioInputVolume)}/${text(ms.AudioVolume.AudioOutputVolume)}`;
        if(ms.IRCutFilterMode) $('#dev_ir').textContent = text(ms.IRCutFilterMode);
        if(ms.usageScenario) $('#dev_usage').textContent = text(ms.usageScenario);

        const wm = config?.IPCam?.WorkMode || {};
        if(wm.Mode) $('#dev_rec_mode').textContent = text(wm.Mode);

        const md = config?.IPCam?.AlarmSetting?.MotionDetection || {};
        if(md){ $('#dev_md').textContent = `WarnTone: ${yesno(md.MotionWarningTone)} · Track: ${yesno(md.motionTrackEnabled)} · Dur: ${text(md.MdRecDuration)}s`; }

        const tf = config?.IPCam?.TfcardManager || {};
        if(tf) $('#dev_tf').textContent = `${text(tf.Status)} · ${text(tf.TotalSpacesize)}M / ${text(tf.LeaveSpacesize)}M`;

        const lte = config?.IPCam?.Lte || config?.IPCam?.LTE || {};
        if(lte) $('#dev_lte').textContent = `${text(lte.OperatorsName)} · ${text(lte.Signal)}`;
      }

      // Hook device info callback (string JSON)
      const _onRemoteSetup = ConnectApi.onRemoteSetup;
      ConnectApi.onRemoteSetup = function(remote_str){
        try { _onRemoteSetup && _onRemoteSetup(remote_str); } catch(_) {}
        try {
          const cfg = JSON.parse(remote_str);
          renderDevice(cfg);
        } catch(e){ console.warn('RemoteSetup parse error', e); }
      };

      $('#btnRefreshDevice').addEventListener('click', fetchDeviceInfo);

      // Playback history
      function initPlaybackDate(){
        const d = new Date();
        const yyyy = d.getFullYear();
        const mm = String(d.getMonth()+1).padStart(2,'0');
        const dd = String(d.getDate()).padStart(2,'0');
        $('#pbDate').value = `${yyyy}-${mm}-${dd}`;
        $('#pbChannel').value = $('#channel').value || '0';
      }

      function searchRecords(){
        const devid = $('#deviceId').value.trim();
        const channel = parseInt($('#pbChannel').value,10) || 0;
        const dateStr = $('#pbDate').value; // yyyy-mm-dd
        if(!devid || !dateStr) return;
        const date = new Date(dateStr);
        if(Number.isNaN(date.getTime())) return;
        const YY = date.getFullYear();
        const MM = String(date.getMonth()+1).padStart(2,'0');
        const DD = String(date.getDate()).padStart(2,'0');
        const begin = new Date(`${YY}-${MM}-${DD} 00:00:00`);
        const end = new Date(`${YY}-${MM}-${DD} 23:59:59`);
        let begintime = Math.floor(begin.getTime()/1000) - new Date().getTimezoneOffset()*60;
        let endtime = Math.floor(end.getTime()/1000) - new Date().getTimezoneOffset()*60;
        // Clear table
        $('#historyBody').innerHTML = '';
        Player.SreachRecord(devid, '', channel, begintime, endtime, 15);
      }

      $('#btnSearchRecords').addEventListener('click', searchRecords);

      // Replace record callback to fill our table
      ConnectApi.onRecordFetch = function(file_type, file_begintime, file_endtime, INDEX){
        const tr = document.createElement('tr');
        const td1 = document.createElement('td');
        const td2 = document.createElement('td');
        const td3 = document.createElement('td');
        const td4 = document.createElement('td');
        const td5 = document.createElement('td');

        td1.style.padding = td2.style.padding = td3.style.padding = td4.style.padding = td5.style.padding = '8px';
        td1.style.borderBottom = td2.style.borderBottom = td3.style.borderBottom = td4.style.borderBottom = td5.style.borderBottom = '1px solid rgba(255,255,255,.08)';

        const startLocal = new Date((file_begintime + new Date().getTimezoneOffset()*60) * 1000).toLocaleString();
        const endLocal = new Date((file_endtime + new Date().getTimezoneOffset()*60) * 1000).toLocaleString();
        const dur = (file_endtime - file_begintime);
        const typ = (file_type == 1 ? 'Schedule' : 'Alarm');
        td1.textContent = startLocal;
        td2.textContent = endLocal;
        td3.textContent = String(dur);
        td4.textContent = typ;
        const btn = document.createElement('button');
        btn.textContent = 'Play';
        btn.className = 'secondary';
        btn.addEventListener('click', () => {
          const devid = $('#deviceId').value.trim();
          const channel = parseInt($('#pbChannel').value,10) || 0;
          // tasktype=0 play in window 0
          Player.StartPlayBack(devid, '', channel, file_begintime, file_endtime, file_type, 0, false, 0);
          showTab('playback');
        });
        td5.appendChild(btn);

        tr.appendChild(td1); tr.appendChild(td2); tr.appendChild(td3); tr.appendChild(td4); tr.appendChild(td5);
        $('#historyBody').appendChild(tr);
      };
    </script>
  </body>
  </html>
